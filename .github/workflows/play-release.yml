# Play용 AAB를 CI에서 빌드해 비공개 테스트(alpha)와 내부 테스트(internal) 두 트랙에 올립니다(README "Play 배포").
#
# - 태그 vX.Y.Z가 올라오면 그 버전을 올립니다(android-release.yml의 GitHub Release와 같은 태그).
# - Actions 화면에서 손으로 돌릴 수도 있습니다(version 입력 → 그 태그의 소스를 빌드). dry_run을 켜면
#   시험·빌드·서명 확인·트랙 조회까지만 하고 Play에 올리지 않습니다.
# - 비밀값은 GitHub 환경 'play'에만 있고, 그 환경은 jeiel85의 승인을 받아야 실행됩니다(main 브랜치·v* 태그만).
# - AAB는 공개 저장소의 Actions 아티팩트로 남기지 않습니다(GitHub Release에도 AAB를 올리지 않는 방침과 같음).
name: Play release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (x.y.z, 태그 vX.Y.Z가 있어야 함)'
        required: true
      dry_run:
        description: '올리지 않고 시험·빌드·서명 확인·트랙 조회만'
        type: boolean
        default: false
      resume:
        description: '이미 Play에 올라간 versionCode면 다시 올리지 않고 alpha·internal 트랙 지정만(한쪽 트랙만 들어간 실행 재개용)'
        type: boolean
        default: false

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    environment: play
    timeout-minutes: 45
    env:
      PACKAGE: com.veritasbible.app
      # Play 업로드 키 인증서(.keystore/veritas-bible-upload.jks, alias upload). 다른 키로 서명된 번들은 올리기 전에 멈춥니다.
      UPLOAD_CERT_SHA256: '11:36:E1:25:43:F3:36:0A:96:7E:B9:2E:D3:CC:6F:C8:EF:02:9F:35:A7:F2:C4:F3:9E:0C:32:11:81:25:0B:C6'
    steps:
      - name: 버전 정하기
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY: ${{ inputs.dry_run }}
          RESUME: ${{ inputs.resume }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then VER="${GITHUB_REF_NAME#v}"; else VER="$INPUT_VERSION"; fi
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::버전은 x.y.z여야 합니다: $VER"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "dry=${DRY:-false}" >> "$GITHUB_OUTPUT"
          echo "resume=${RESUME:-false}" >> "$GITHUB_OUTPUT"

      # 앱 소스는 릴리스 태그에서, 업로드 스크립트(tools/)는 이 워크플로가 돈 커밋에서 가져옵니다.
      # (손으로 돌릴 때 예전 태그에는 tools/가 없을 수 있음)
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ steps.ver.outputs.version }}

      - uses: actions/checkout@v4
        with:
          path: .ci
          sparse-checkout: tools

      - name: 릴리스 메타데이터 검증·versionCode 읽기
        id: meta
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          pwsh -NoProfile -File scripts/validate_release_version.ps1 "v$VER"
          CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)
          [[ "$CODE" =~ ^[0-9]+$ ]] || { echo "::error::app/build.gradle.kts에서 versionCode를 읽지 못했습니다"; exit 1; }
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "v$VER → versionCode $CODE"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 platforms;android-36.1 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: 서명 키 놓기
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keys/veritas-bible-upload.jks"
          [ -s "$RUNNER_TEMP/keys/veritas-bible-upload.jks" ]

      - name: 시험
        run: |
          chmod +x gradlew  # v1.8.3 이전 태그는 gradlew가 100644로 커밋돼 있음
          ./gradlew testDebugUnitTest

      - name: AAB 빌드
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/keys/veritas-bible-upload.jks
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease
          AAB=app/build/outputs/bundle/release/app-release.aab
          [ -s "$AAB" ]
          echo "AAB=$AAB" >> "$GITHUB_ENV"

      - name: 출시 노트(play_store/release_notes에서)
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          for L in ko-KR en-US; do
            tr -d '\r' < "play_store/release_notes/v$VER.txt" \
              | awk -v o="<$L>" -v c="</$L>" '$0==o {on=1; next} $0==c {on=0} on' > "$RUNNER_TEMP/notes/$L.txt"
            [ -s "$RUNNER_TEMP/notes/$L.txt" ] || { echo "::error::$L 출시 노트가 비었습니다"; exit 1; }
          done

      - name: Play 트랙 상태(올리기 전)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: pwsh -NoProfile -File .ci/tools/play-publish.ps1 -PackageName "$PACKAGE" -ShowTracks

      - name: 비공개 테스트(alpha)·내부 테스트(internal)에 올리기
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VER: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.meta.outputs.code }}
          DRY: ${{ steps.ver.outputs.dry }}
          RESUME: ${{ steps.ver.outputs.resume }}
        run: |
          DRYFLAG=(); [ "$DRY" = true ] && DRYFLAG=(-DryRun)
          NOTES=(-NotesKoFile "$RUNNER_TEMP/notes/ko-KR.txt" -NotesEnFile "$RUNNER_TEMP/notes/en-US.txt")
          # 스크립트는 트랙마다 따로 커밋합니다. alpha만 들어가고 internal에서 멈췄다면 resume으로 다시 돌립니다
          # (같은 versionCode는 다시 올릴 수 없으므로 업로드 없이 이미 올라간 번들을 두 트랙에 지정).
          if [ "$RESUME" = true ]; then
            pwsh -NoProfile -File .ci/tools/play-publish.ps1 -PackageName "$PACKAGE" -Track alpha -ExpectedVersionCode "$CODE" \
              -VersionName "$VER" "${NOTES[@]}" "${DRYFLAG[@]}"
          else
            pwsh -NoProfile -File .ci/tools/play-publish.ps1 -PackageName "$PACKAGE" -Track alpha -AabPath "$AAB" \
              -ExpectedVersionCode "$CODE" -ExpectedUploadCertSha256 "$UPLOAD_CERT_SHA256" -VersionName "$VER" \
              "${NOTES[@]}" "${DRYFLAG[@]}"
          fi
          pwsh -NoProfile -File .ci/tools/play-publish.ps1 -PackageName "$PACKAGE" -Track internal -ExpectedVersionCode "$CODE" \
            -VersionName "$VER" "${NOTES[@]}" "${DRYFLAG[@]}"

      - name: Play 트랙 상태(올린 뒤)
        if: steps.ver.outputs.dry != 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: pwsh -NoProfile -File .ci/tools/play-publish.ps1 -PackageName "$PACKAGE" -ShowTracks

      - name: 키 지우기
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
